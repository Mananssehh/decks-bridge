# Fixture for scripts/release-policy.test.mjs, not a workflow: PR #1's release.yml
# before reconciliation. It must FAIL the release policy (secrets in if:, v* tags,
# write token for every job, third-party release action, Windows job, no latest.json).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the whole release on the test suite. Without this, a tag push would
  # sign, notarize and publish a build that nothing had verified — the tests
  # only protect the product if they can actually block a release.
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --bin decks-bridge

      - name: Frontend build (includes the mock-data guard)
        run: npm run build

  build-macos:
    needs: verify
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_tag: aarch64
          - target: x86_64-apple-darwin
            arch_tag: x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      # Fail-closed. This workflow runs ONLY on v* tags — every run is a public
      # release, so it must be fully signable + notarizable. If any required
      # secret is missing we abort the entire release here. There is deliberately
      # NO ad-hoc fallback: the previous fallback published an unsigned build
      # that reached users as "Decks Bridge is damaged and can't be opened".
      # For an unsigned local build, run scripts/build-internal.sh — never CI.
      - name: Release secrets preflight (no ad-hoc fallback)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$APPLE_CERTIFICATE" ]]          || missing+=("APPLE_CERTIFICATE")
          [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]] || missing+=("APPLE_CERTIFICATE_PASSWORD")
          [[ -n "$APPLE_SIGNING_IDENTITY" ]]     || missing+=("APPLE_SIGNING_IDENTITY")
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]  || missing+=("TAURI_SIGNING_PRIVATE_KEY")
          # Notarization needs EITHER the App Store Connect API key trio OR the
          # Apple ID app-password trio.
          if [[ -z "$APPLE_API_KEY" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
            if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
              missing+=("notarization creds: (APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER) or (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID)")
            fi
          fi
          if (( ${#missing[@]} )); then
            echo "::error::Release aborted — missing signing/notarization secrets: ${missing[*]}"
            echo "Configure them under Settings → Secrets and variables → Actions, then re-tag."
            echo "Refusing to publish an unsigned build that Gatekeeper reports as 'damaged'."
            exit 1
          fi
          echo "All required signing + notarization secrets are present."

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          security find-identity -v -p codesigning build.keychain
          security find-identity -v -p codesigning build.keychain | grep -q "Developer ID Application" \
            || { echo "::error::Imported certificate is not a Developer ID Application identity"; exit 1; }

      - name: Write App Store Connect API key
        if: ${{ secrets.APPLE_API_KEY != '' }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey.p8

      - name: Production macOS build (sign + notarize + staple + package + verify)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build-release.sh ${{ matrix.target }}

      # Publish ONLY the notarized public artifacts. release/internal/** is
      # never uploaded, so an ad-hoc build can't reach a Release even if one
      # exists on the runner. Fail (not warn) if the signed build produced
      # nothing — an empty upload previously became an empty, broken Release.
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch_tag }}
          path: |
            release/v[0-9]*/mac/**/*
            release/SHA256SUMS.txt
          if-no-files-found: error

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # Fail-closed, same policy as macOS: a public release must be signed. An
      # unsigned installer trips SmartScreen and erodes trust; publishing one as
      # an official Release is the same defect class as the macOS "damaged" bug.
      # For an unsigned local build use scripts/build-internal-windows.ps1.
      - name: Build Windows release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $missing = @()
          if (-not $env:WINDOWS_SIGNING_CERT) { $missing += "WINDOWS_SIGNING_CERT" }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { $missing += "TAURI_SIGNING_PRIVATE_KEY" }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Release aborted — missing Windows signing secrets: $($missing -join ', ')"
            Write-Host "Configure them in Actions secrets and re-tag. Refusing to publish an unsigned installer."
            exit 1
          }
          $certPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT))
          $env:WINDOWS_SIGNING_CERT = $certPath
          npm run build:release:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            release/windows/**/*
            release/v*/windows/**/*
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          set -euo pipefail
          mkdir -p release-upload
          find artifacts -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.sig' -o -name '*.exe' \
          \) -exec cp {} release-upload/ \;
          find artifacts -name 'SHA256SUMS.txt' -exec cp {} release-upload/ \;
          ls -la release-upload/
          # Never create an empty or macOS-less Release. The build jobs are
          # fail-closed, so reaching here means they succeeded — but assert the
          # notarized .dmg is actually present before we publish anything.
          if ! ls release-upload/*.dmg >/dev/null 2>&1; then
            echo "::error::No .dmg in release assets — refusing to publish an incomplete release."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-upload/*
          generate_release_notes: true
