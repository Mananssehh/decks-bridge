name: Release

# Publishes a Decks Bridge release — and with it the in-app update — ONLY when a
# version tag is pushed. Pushes and merges to branches (main included) never run
# this workflow: installed apps read latest.json from the newest *published,
# non-pre-release* GitHub Release, and only the `publish` job below creates one.
#
#   1. npm run release:version -- 1.2.3        (sets every version file)
#   2. Add "## [1.2.3] - YYYY-MM-DD" to CHANGELOG.md (DJs see this text)
#   3. Merge to main, then: git tag v1.2.3 && git push origin v1.2.3
#
# Scope: macOS only (Apple Silicon + Intel). Every published build is Developer
# ID signed, notarized, stapled and accepted by Gatekeeper; anything else stops
# the run before a release exists. Windows is not built or published here yet
# (RELEASE.md → "Enabling Windows releases later").
#
# Tags like v1.2.3-rc.1 publish a GitHub *pre-release*, which installed apps
# ignore — use them to rehearse. "Run workflow" (workflow_dispatch) builds,
# signs, notarizes and verifies everything but never publishes.
# One-time setup, secrets and limitations: RELEASE.md.
# Policy guard: scripts/release-policy.test.mjs (part of `npm test`).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Version, notes and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The tag must name the version the app reports at runtime, or installed
      # apps would be offered the same "update" again after installing it.
      - name: Tag matches the app version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/release-tools.mjs check-version --tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            node scripts/release-tools.mjs check-version >> "$GITHUB_OUTPUT"
          fi

      - name: Stable releases come from main
        if: github.ref_type == 'tag' && steps.version.outputs.prerelease == 'false'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main. Merge the release to main first, then tag that commit."
            exit 1
          fi

      - name: Release notes exist in CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-tools.mjs release-notes "$VERSION" --out release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

      # Fail before anything is built. Only secret NAMES are ever printed.
      - name: Release secrets are configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release-tools.mjs check-secrets

      - run: npm ci

      # A wrong updater key or password would otherwise only show up after the
      # macOS builds; an update signed by any other key is rejected by every
      # installed app.
      - name: Updater key matches the app's public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/updater-key-probe.bin"
          head -c 4096 /dev/urandom > "$probe"
          npx tauri signer sign "$probe" > /dev/null
          node scripts/release-tools.mjs verify-signature "$probe" "$probe.sig"
          rm -f "$probe" "$probe.sig"

  verify:
    name: Tests and build checks
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Frontend build (includes the mock-data guard)
        run: npm run build

      # After the frontend build: the Rust crate embeds dist/ at compile time.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --bin decks-bridge

  build-macos:
    name: macOS (${{ matrix.arch }})
    needs: [prepare, verify]
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            platform: darwin-aarch64
          - target: x86_64-apple-darwin
            arch: x64
            platform: darwin-x86_64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: npm ci

      # With assessments switched off, spctl "accepts" everything and could not
      # tell a notarized build from any other.
      - name: Gatekeeper assessments are enabled
        run: |
          set -euo pipefail
          if ! spctl --status | grep -q 'assessments enabled'; then
            sudo spctl --master-enable
          fi
          spctl --status | grep -q 'assessments enabled' \
            || { echo "::error::Gatekeeper assessments are disabled on this runner."; exit 1; }

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/decks-bridge-signing.keychain-db"
          cert="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$cert"' EXIT
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          # No auto-lock during the long build that comes before signing.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          security import "$cert" -k "$keychain" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q '"Developer ID Application: '; then
            echo "::error::APPLE_CERTIFICATE does not contain a Developer ID Application certificate with its private key."
            exit 1
          fi

      # notarytool needs the key as a file. The path is expanded here and handed
      # to later steps through GITHUB_ENV, so they all use this exact file.
      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_API_KEY" ]]; then
            echo "No APPLE_API_KEY secret: notarizing with APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID."
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY" > "$key_path")
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # scripts/build-release.sh: signing preflight → build → Developer ID sign
      # → notarize + staple → signed + notarized DMG, ZIP and signed updater
      # tarball → verify every artifact. Any failure stops the job.
      - name: Build, sign, notarize, package and verify
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build-release.sh "$TARGET"

      - name: Release files are complete
        run: node scripts/release-tools.mjs check-release-files --version "$VERSION" --dir "release/v$VERSION/mac" --platforms "$PLATFORM"

      - name: Remove the signing keychain and API key
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"

      # Only the verified public artifacts of this architecture. Internal
      # builds (release/internal/) are never uploaded.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/v${{ needs.prepare.outputs.version }}/mac/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, verify, build-macos]
    # Tag pushes only: a manual run (workflow_dispatch) is a dry run, even on a tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Both architectures, nothing missing and nothing extra. latest.json
      # lists only them, and every updater signature is verified against the
      # public key the installed apps trust before latest.json is written.
      - name: Assemble release files and latest.json
        run: |
          set -euo pipefail
          mkdir -p release-upload
          cp artifacts/macos-aarch64/* artifacts/macos-x64/* release-upload/
          node scripts/release-tools.mjs check-release-files --version "$VERSION" --dir release-upload
          node scripts/release-tools.mjs latest-json \
            --version "$VERSION" --repo "$GITHUB_REPOSITORY" --assets-dir release-upload \
            --notes-file artifacts/release-notes/release-notes.md --out release-upload/latest.json
          (cd release-upload && sha256sum -- * > SHA256SUMS.txt)
          node scripts/release-tools.mjs check-release-files --version "$VERSION" --dir release-upload --final
          ls -la release-upload

      # Upload everything to a draft first: installed apps only see a release
      # once it is published, so they never find a half-uploaded one.
      - name: Create draft release
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $TAG is already published. Published releases are never replaced; tag a new version."
              exit 1
            fi
            echo "Replacing the unpublished draft left by an earlier attempt."
            gh release delete "$TAG" --yes
          fi
          flags=(--draft --verify-tag --title "Decks Bridge $VERSION" --notes-file artifacts/release-notes/release-notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" release-upload/*

      - name: Publish release
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          echo "Published $TAG."
